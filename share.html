<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>A MaxRides dream build · shared with you</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .share { padding: var(--space-12) 0; }
    .share-stage {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      margin-top: var(--space-6);
    }
    .build-table { width: 100%; margin-top: var(--space-6); font-size: 14px; }
    .build-table tr { border-bottom: 1px solid var(--border); }
    .build-table th { text-align: left; color: var(--text-tertiary); font-weight: 400; padding: var(--space-3) 0; font-size: 12px; }
    .build-table td { text-align: right; color: var(--text-primary); padding: var(--space-3) 0; font-variant-numeric: tabular-nums; }
    .build-table .item { color: var(--text-primary); font-weight: 500; }
    .build-table .total-row td, .build-table .total-row th { font-size: 18px; color: var(--text-primary); font-weight: 500; padding-top: var(--space-4); }
    .build-table .total-row .v { color: var(--accent); font-size: 22px; }
    .note-card {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      padding: var(--space-4) var(--space-5);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin-top: var(--space-6);
      font-size: 14px;
      font-style: italic;
      color: var(--text-primary);
      line-height: 1.55;
    }
    .split-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      border: 1px solid rgba(255, 90, 31, 0.4);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
      margin-top: var(--space-4);
    }
    .action-row {
      display: grid;
      gap: var(--space-3);
      margin-top: var(--space-8);
    }
    @media (min-width: 480px) {
      .action-row { grid-template-columns: 2fr 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="wordmark">maxrides</a>
    </div>
  </header>

  <main class="share container-narrow">
    <p class="eyebrow">A MaxRides dream build · shared with you</p>
    <h1 class="h1" id="share-title" style="margin-top:var(--space-2);">Your kid built this. Here’s exactly what they want.</h1>

    <div class="share-stage" id="share-stage"></div>

    <div id="note-host"></div>

    <table class="build-table" id="build-table"></table>

    <div id="split-info-host"></div>

    <div class="action-row">
      <button class="btn btn--primary btn--lg" id="buy-btn">Buy it now<span class="btn__arrow">→</span></button>
      <button class="btn btn--secondary btn--lg" id="reply-btn">Send a reply</button>
    </div>

    <p class="caption" style="margin-top:var(--space-6); text-align:center;">No account, no rebuild. One tap and the bike is in your cart.</p>
  </main>

  <footer class="site-footer">
    <div class="container-wide">
      <div class="site-footer__legal">
        <span>&copy; <span data-year>2026</span> MaxRides.</span>
        <span><a href="index.html">About MaxRides</a></span>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/bikes.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    'use strict';
    var hash = location.hash.replace(/^#/, '');
    var titleEl = document.getElementById('share-title');
    var stageEl = document.getElementById('share-stage');
    var noteHost = document.getElementById('note-host');
    var tableEl = document.getElementById('build-table');
    var splitHost = document.getElementById('split-info-host');
    var buyBtn = document.getElementById('buy-btn');
    var DATA = window.MAXRIDES_DATA;

    if (!hash) {
      titleEl.textContent = 'Nothing to show.';
      stageEl.innerHTML = '<p class="body" style="text-align:center;">This link is missing the build payload. Ask the sender to resend.</p>';
      return;
    }

    var payload;
    try { payload = JSON.parse(atob(hash)); } catch (e) {
      titleEl.textContent = 'Couldn’t read this link.';
      return;
    }

    var bike = DATA.findBike(payload.bike);
    var color = DATA.FRAME_COLORS.find(function (c) { return c.id === payload.color; }) || DATA.FRAME_COLORS[0];
    var lineItems = [{ label: bike.name + ' frame', price: bike.basePrice }];
    if (color.priceDelta) lineItems.push({ label: color.name + ' paint', price: color.priceDelta });
    Object.keys(payload.selections || {}).forEach(function (catId) {
      var cat = DATA.COMPONENT_CATEGORIES.find(function (c) { return c.id === catId; });
      if (!cat) return;
      var opt = cat.options.find(function (o) { return o.id === payload.selections[catId]; });
      if (opt && opt.priceDelta > 0) {
        lineItems.push({ label: cat.title + ': ' + opt.name, price: opt.priceDelta });
      }
    });
    var total = lineItems.reduce(function (s, li) { return s + li.price; }, 0);

    stageEl.innerHTML = window.bikeImage(bike.slug, color.hex);

    if (payload.note) {
      noteHost.innerHTML =
        '<div class="note-card">' + escapeHtml(payload.note) + '</div>';
    }

    var rows = lineItems.map(function (li) {
      return '<tr><th class="item">' + escapeHtml(li.label) + '</th><td>$' + li.price.toLocaleString() + '</td></tr>';
    }).join('');
    rows += '<tr class="total-row"><th>Total</th><td class="v">$' + total.toLocaleString() + '</td></tr>';
    tableEl.innerHTML = rows;

    if (payload.split) {
      var kidShare = Math.round(total * 0.18);
      var parentShare = total - kidShare;
      splitHost.innerHTML =
        '<div class="split-pill">Split offer: kid covers $' + kidShare.toLocaleString() + ' · you cover $' + parentShare.toLocaleString() + '</div>';
    }

    buyBtn.addEventListener('click', function () {
      // Push into cart and go to cart.html
      var raw = localStorage.getItem('maxrides.cart');
      var cart = raw ? JSON.parse(raw) : [];
      cart.push({
        id: 'ci_' + Date.now(),
        bike: bike.slug,
        bikeName: bike.name,
        color: color.id,
        colorName: color.name,
        colorHex: color.hex,
        plate: payload.plate || '88',
        selections: payload.selections || {},
        lineItems: lineItems,
        total: total,
        qty: 1
      });
      localStorage.setItem('maxrides.cart', JSON.stringify(cart));
      location.href = 'cart.html';
    });

    document.getElementById('reply-btn').addEventListener('click', function () {
      location.href = 'sms:&body=' + encodeURIComponent('Saw your MaxRides dream build. Let’s talk about it 🙂');
    });

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  })();
  </script>
</body>
</html>
