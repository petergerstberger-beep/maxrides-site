<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Build your MaxRides — Configurator</title>
  <meta name="description" content="Configure your MaxRides bike across 21 component categories with real-world Sur-Ron, Talaria, and Super73-grade parts.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    /* Builder-specific layout */
    .builder { padding-bottom: 96px; }

    .builder-hero {
      position: -webkit-sticky;
      position: sticky;
      top: 52px;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .builder-hero__inner {
      max-width: var(--container-wide);
      margin: 0 auto;
      padding: var(--space-3) var(--space-5);
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: var(--space-4);
      align-items: center;
    }
    .builder-hero__stage {
      background: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 4px 8px;
      height: 64px;
      width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .builder-hero__stage svg,
    .builder-hero__stage img.bike-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: filter var(--dur-base) var(--ease-out);
    }
    .builder-hero__meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-3);
    }
    .builder-hero__bike {
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .builder-hero__total {
      font-size: 22px;
      font-weight: 500;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .builder-hero__pill-row {
      max-width: var(--container-wide);
      margin: 0 auto;
      padding: 0 var(--space-5) var(--space-2);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .builder-hero__pill-row::-webkit-scrollbar { display: none; }
    .builder-hero__pill-row .chip { white-space: nowrap; cursor: pointer; font-size: 12px; padding: 4px 10px; }
    @media (max-width: 720px) {
      .builder-hero__inner { grid-template-columns: 100px 1fr; padding: var(--space-2) var(--space-4); gap: var(--space-3); }
      .builder-hero__stage { height: 52px; width: 100px; }
      .builder-hero__total { font-size: 18px; }
      .builder-hero__bike { font-size: 12px; }
    }

    .builder-section {
      max-width: var(--container-wide);
      margin: 0 auto;
      padding: var(--space-8) var(--space-5);
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 240px;
    }
    .builder-section__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }
    .builder-section__head .selected-name {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
    }
    .builder-section__blurb {
      color: var(--text-secondary);
      font-size: 14px;
      margin: -8px 0 var(--space-5);
      max-width: 50ch;
    }

    .option-grid {
      display: grid;
      gap: var(--space-3);
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    .option-grid--narrow { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }

    .option {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      cursor: pointer;
      transition:
        border-color var(--dur-fast) var(--ease-out),
        background var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .option:hover { border-color: var(--text-tertiary); }
    .option.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }
    .option__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .option__title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: var(--lh-snug);
    }
    .option__brand { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .option__price {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
    }
    .option__price.is-included { color: var(--text-tertiary); }
    .option__summary { font-size: 12px; color: var(--text-secondary); line-height: var(--lh-normal); }
    .option__specs {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 12px;
      font-size: 11px;
      border-top: 1px solid var(--border);
      padding-top: var(--space-3);
    }
    .option__specs dt { color: var(--text-tertiary); text-transform: capitalize; }
    .option__specs dd { color: var(--text-primary); }

    /* Color swatches for FRAME_COLORS */
    .color-row {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .color-swatch-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .color-swatch-btn .swatch { width: 44px; height: 44px; }
    .color-swatch-btn .name { font-size: 10px; color: var(--text-tertiary); }
    .color-swatch-btn.is-selected .name { color: var(--text-primary); }
    .color-swatch-btn.is-selected .swatch { border-color: var(--text-primary); transform: scale(1.05); }
    .color-swatch-btn .delta { font-size: 9px; color: var(--accent); }

    /* Custom plate number input */
    .plate-input {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-top: var(--space-4);
    }
    .plate-input label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
    .plate-input input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-align: right;
    }
    .plate-input input::placeholder { color: var(--text-quaternary); }

    /* Builder footer (sticky bottom) */
    .builder-footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 30;
      background: rgba(10,10,10,0.92);
      backdrop-filter: saturate(140%) blur(18px);
      border-top: 1px solid var(--border);
    }
    .builder-footer__inner {
      max-width: var(--container-wide);
      margin: 0 auto;
      padding: var(--space-3) var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .builder-footer__total .label { font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; }
    .builder-footer__total .value { font-size: 18px; font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .builder-footer__actions { display: flex; gap: var(--space-2); }
    @media (max-width: 480px) {
      .builder-footer__actions .btn--save { display: none; }
    }

    /* ===== Live bike viewer (photo + parallax rotation) ===== */
    .bike-3d-section {
      background:
        radial-gradient(ellipse 70% 60% at 50% 65%, #EFEFEF 0%, #FFFFFF 60%, #FAFAFA 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .bike-3d-viewer {
      max-width: var(--container-wide);
      margin: 0 auto;
      height: 520px;
      position: relative;
      perspective: 1800px;
      perspective-origin: 50% 55%;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .bike-3d-viewer:active { cursor: grabbing; }
    .bike-3d-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .bike-3d-photo-wrap {
      position: relative;
      width: 78%;
      height: 78%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      will-change: transform, filter;
      transition: filter 280ms ease;
    }
    .bike-3d-photo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 36px 38px rgba(0,0,0,0.22)) drop-shadow(0 6px 10px rgba(0,0,0,0.12));
      transition: filter 280ms ease, opacity 220ms ease;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .bike-3d-photo.is-swapping { opacity: 0; }
    .bike-3d-shadow {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 62%;
      height: 26px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.18) 40%, transparent 75%);
      transform: translateX(-50%);
      pointer-events: none;
      filter: blur(8px);
      will-change: transform, opacity;
    }
    /* Plate preview chip — sits at lower-right of the viewer as a
       config readout (not attached to the bike, because anchor points
       differ per photo). Live updates as user picks plate color/number. */
    .bike-3d-plate {
      position: absolute;
      right: 28px;
      bottom: 78px;
      width: 88px;
      height: 88px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      background: #FF5A1F;
      border: 2px solid rgba(0,0,0,0.08);
      box-shadow:
        0 8px 22px rgba(0,0,0,0.22),
        0 2px 6px rgba(0,0,0,0.12),
        inset 0 0 0 3px rgba(255,255,255,0.18);
      transform: rotate(-3deg);
      transition: opacity 240ms ease, background-color 240ms ease, color 240ms ease, transform 240ms ease;
      pointer-events: none;
      z-index: 3;
    }
    .bike-3d-plate::before {
      content: 'PLATE';
      position: absolute;
      top: -16px;
      left: 0;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-tertiary);
      text-align: left;
    }
    .bike-3d-plate.is-hidden { opacity: 0; transform: rotate(-3deg) scale(0.7); }
    .bike-3d-plate--light { color: #0A0A0A; }

    .bike-3d-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #555;
      background: rgba(255,255,255,0.92);
      padding: 6px 16px;
      border-radius: 999px;
      pointer-events: none;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 2px 14px rgba(0,0,0,0.08);
      opacity: 1;
      transition: opacity 600ms ease;
    }
    .bike-3d-hint.is-hidden { opacity: 0; }
    .bike-3d-label {
      position: absolute;
      top: 18px;
      left: 22px;
      color: #1a1a1a;
      pointer-events: none;
      z-index: 2;
    }
    .bike-3d-label .eyebrow { color: var(--accent); margin-bottom: 2px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .bike-3d-label .title { font-size: 20px; font-weight: 500; color: #0a0a0a; }
    @media (max-width: 720px) {
      .bike-3d-viewer { height: 380px; }
      .bike-3d-label { top: 12px; left: 14px; }
      .bike-3d-label .title { font-size: 15px; }
      .bike-3d-plate { width: 58px; height: 58px; font-size: 22px; top: 36%; left: 14%; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="wordmark" aria-label="MaxRides home">maxrides</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Shop</a>
        <a href="build.html" class="active">Build</a>
        <a href="rides.html">Rides</a>
        <a href="reviews.html">Reviews</a>
      </nav>
      <a class="icon-link" href="cart.html" aria-label="Cart">
        <span>Cart</span>
        <span data-cart-count class="caption"></span>
      </a>
    </div>
  </header>

  <main class="builder">

    <!-- ===== Live bike viewer (photo + parallax rotation, plate overlay) ===== -->
    <section class="bike-3d-section">
      <div class="bike-3d-viewer" id="bike-3d-viewer" aria-label="Live bike preview">
        <div class="bike-3d-label">
          <p class="eyebrow" id="bike-3d-eyebrow">Live preview</p>
          <p class="title" id="bike-3d-title">Sur-Ron Light Bee X</p>
        </div>
        <div class="bike-3d-stage" id="bike-3d-stage">
          <div class="bike-3d-shadow" id="bike-3d-shadow"></div>
          <div class="bike-3d-photo-wrap" id="bike-3d-photo-wrap">
            <img id="bike-3d-photo" class="bike-3d-photo" alt="" draggable="false">
            <div class="bike-3d-plate is-hidden" id="bike-3d-plate" aria-hidden="true">73</div>
          </div>
        </div>
        <div class="bike-3d-hint" id="bike-3d-hint">Drag to rotate</div>
      </div>
    </section>

    <!-- Sticky hero: bike preview + live total -->
    <div class="builder-hero">
      <div class="builder-hero__inner">
        <div class="builder-hero__stage" id="builder-stage" data-bike="sur-ron-light-bee-x" data-accent="#FF5A1F"></div>
        <div class="builder-hero__meta">
          <div class="builder-hero__bike" id="builder-bike-label">Building · Sur-Ron Light Bee X</div>
          <div class="builder-hero__total" id="builder-total">$4,400</div>
        </div>
      </div>
      <div class="builder-hero__pill-row" id="bike-pill-row" aria-label="Switch bike"></div>
    </div>

    <!-- ===== 01 · Frame color (custom — swatches) ===== -->
    <section class="builder-section" id="cat-color">
      <div class="builder-section__head">
        <p class="eyebrow">01 · Frame color</p>
        <span class="selected-name" id="selected-color">Gloss orange</span>
      </div>
      <p class="builder-section__blurb">Solid colors. Picks the base layer of the paint job.</p>
      <div class="color-row" id="color-row"></div>
    </section>

    <!-- The other 20 categories are rendered by build.js into this container -->
    <div id="categories-host"></div>

  </main>

  <!-- Sticky footer -->
  <div class="builder-footer">
    <div class="builder-footer__inner">
      <div class="builder-footer__total">
        <div class="label">Your build</div>
        <div class="value" id="footer-total">$4,400</div>
      </div>
      <div class="builder-footer__actions">
        <button type="button" class="btn btn--secondary btn--save" id="save-wishlist-btn">Save to wishlist</button>
        <button type="button" class="btn btn--primary" id="add-to-cart-btn">Add to cart<span class="btn__arrow">→</span></button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js?v=4a"></script>
  <script src="assets/js/bikes.js?v=4a"></script>
  <script src="assets/js/bike-viewer.js?v=4a"></script>
  <script src="assets/js/build.js?v=4a"></script>
  <script src="assets/js/app.js?v=4a"></script>
</body>
</html>
